name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Etiket ile package.json sürümü aynı mı?
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "Etiket ($TAG) ile package.json sürümü ($VER) farklı"; exit 1
          fi
      - name: Güncelleme deposunu bu depodan al (package.json'daki değerden bağımsız)
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const [o,r]=process.env.GITHUB_REPOSITORY.split('/');p.build.publish=[{provider:'github',owner:o,repo:r,releaseType:'release'}];fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log('publish =',JSON.stringify(p.build.publish));"
      - run: npm ci
      - run: npm test
      - name: Kurulum dosyasını derle (yayınlamadan)
        run: npx electron-builder --win nsis --publish never
      - name: Tek bir release olarak yayınla
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml \
            --title "${GITHUB_REF_NAME#v}" \
            --generate-notes
