version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Büyük sürüm atlamaları (ör. Electron 44 -> 45) kendiliğinden önerilmesin; yalnızca küçük ve yama sürümleri.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
